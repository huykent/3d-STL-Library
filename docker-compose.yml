version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: stl_postgres
    environment:
      POSTGRES_USER: stluser
      POSTGRES_PASSWORD: stlpass
      POSTGRES_DB: stl_library
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stluser -d stl_library"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stl_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
